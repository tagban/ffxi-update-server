name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # static: runs on any distribution
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xi-vault dist/xi-vault-linux-${{ matrix.arch }}
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      # one program, three names: a double-click does what the name says
      - run: |
          mkdir -p dist
          cp target/release/xi-vault.exe dist/xi-vault.exe
          cp target/release/xi-vault.exe dist/ffxi-update-publisher.exe
          cp target/release/xi-vault.exe dist/ffxi-updater.exe
          cp scripts/install-server.ps1 scripts/install-server.cmd dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # Apple silicon natively; Intel for the Macs that still need it
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.arch == 'arm64'
        run: cargo test --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xi-vault dist/xi-vault
          lipo -info dist/xi-vault
      - run: scripts/ci/sign-macos.sh dist/xi-vault dist/xi-vault-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # an unsigned Mac build stays a workflow artifact; the release gets the notarized one
      - run: rm -f dist/*-unsigned.zip && cp scripts/install-server.sh dist/ && ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
